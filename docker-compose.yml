# Dipakai oleh deploy/deploy.sh di server. Konfigurasi di berkas .env (dibuat otomatis saat deploy pertama).
services:
  app:
    image: perahu-perahu:${APP_VERSION:?isi APP_VERSION di .env}
    container_name: ${COMPOSE_PROJECT_NAME:-perahu-perahu}-app
    restart: unless-stopped
    environment:
      GAME_MIN_PLAYERS: ${GAME_MIN_PLAYERS:-4}
      GAME_MAX_PLAYERS: ${GAME_MAX_PLAYERS:-5}
      GAME_OFFLINE_AUTOPLAY_SECONDS: ${GAME_OFFLINE_AUTOPLAY_SECONDS:-45}
      GAME_TURN_TIMEOUT_SECONDS: ${GAME_TURN_TIMEOUT_SECONDS:-0}
      GAME_BOT_DELAY_MILLIS: ${GAME_BOT_DELAY_MILLIS:-1200}
      GAME_LOBBY_OFFLINE_KICK_SECONDS: ${GAME_LOBBY_OFFLINE_KICK_SECONDS:-120}
      GAME_IDLE_ROOM_MINUTES: ${GAME_IDLE_ROOM_MINUTES:-30}
      GAME_ALLOWED_ORIGINS: ${GAME_ALLOWED_ORIGINS:-*}
      JAVA_OPTS: ${JAVA_OPTS:--Xms128m -Xmx512m}
      TZ: Asia/Jakarta
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-7770}:8080"
