spring.application.name=perahu-perahu
server.port=8080

# Jumlah pemain per room. Untuk mencoba sendiri saat development, turunkan min-players ke 2:
#   java -jar perahu-perahu.jar --game.min-players=2
game.min-players=4
game.max-players=5

# Kalau pemain offline saat gilirannya, server menjalankan langkah otomatis setelah sekian detik
game.offline-autoplay-seconds=45
# Batas waktu giliran untuk semua pemain (detik). 0 = tanpa batas.
# Kalau diisi, langkah otomatis dijalankan saat waktu habis.
game.turn-timeout-seconds=0
# Jeda langkah bot (milidetik), supaya langkahnya bisa diikuti di layar
game.bot-delay-millis=1200
# Pemain offline di lobby dikeluarkan setelah sekian detik
game.lobby-offline-kick-seconds=120
# Room tanpa pemain online dihapus setelah sekian menit
game.idle-room-minutes=30

# Asal (origin) yang boleh membuka WebSocket. Di produksi isi dengan domainmu, mis. https://game.contoh.id
game.allowed-origins=*
